servers:
  - url: '{apiRoot}/subscription-status/v0.2rc2'
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Retrieve Subscription Status
    description: Operations to retrieve the mobile subscription status of a phone number.
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/SubscriptionStatus
paths:
  /retrieve-subscription-status:
    post:
      security:
        - openId:
            - subscription-status:retrieve-subscription-status
      tags:
        - Retrieve Subscription Status
      description: |
        Obtain the mobile subscription status of the provided phone number, including Voice/SMS inbound, Voice/SMS outbound, and data service status.
      operationId: retrieveSubscriptionStatus
      summary: Retrieve the mobile subscription status of a phone number
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionStatusRequest'
            examples:
              Three-Legged Access Token Example:
                value: {}
              Two-Legged Access Token Example:
                value:
                  phoneNumber: '+346661113334'
      responses:
        '200':
          description: Subscription status retrieved successfully
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/IdentifierNotFound404'
        '422':
          $ref: '#/components/responses/PhoneNumberIdentifier422'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
components:
  securitySchemes:
    openId:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
      description: OpenID Connect authentication via discovery metadata.
  parameters:
    x-correlator:
      name: x-correlator
      in: header
      description: Correlation id for the different services
      schema:
        $ref: '#/components/schemas/XCorrelator'
  headers:
    x-correlator:
      description: Correlation id for the different services
      schema:
        $ref: '#/components/schemas/XCorrelator'
  schemas:
    SubscriptionStatusRequest:
      type: object
      description: Request payload used to retrieve the mobile subscription status of a phone number.
      additionalProperties: false
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
    SubscriptionStatusResponse:
      type: object
      description: Current subscription status for inbound voice/SMS, outbound voice/SMS, and data service.
      additionalProperties: false
      required:
        - voiceSmsIn
        - voiceSmsOut
        - dataService
      properties:
        voiceSmsIn:
          type: string
          enum:
            - active
            - suspended
          maxLength: 9
          description: Status of inbound Voice/SMS services
        voiceSmsOut:
          type: string
          enum:
            - active
            - suspended
          maxLength: 9
          description: Status of outbound Voice/SMS services
        dataService:
          type: string
          enum:
            - active
            - suspended
            - throttled
          maxLength: 9
          description: Status of mobile data service
    PhoneNumber:
      description: A public identifier addressing a telephone subscription. In mobile networks it corresponds to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally unique it has to be formatted in international format, according to E.164 standard, prefixed with '+'.
      type: string
      pattern: ^\+[1-9][0-9]{4,14}$
      maxLength: 16
      example: '+123456789'
    XCorrelator:
      type: string
      description: Correlator string, UUID format recommended but any string matching the pattern can be used
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
      maxLength: 256
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    ErrorInfo:
      type: object
      description: A structured error response providing details about a failed request, including the HTTP status code, an error code, and a human-readable message
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP response status code
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the error
        message:
          type: string
          maxLength: 512
          description: A human-readable description of what the event represents
  examples:
    GENERIC_400_INVALID_ARGUMENT:
      description: Invalid Argument. Generic Syntax Exception
      value:
        status: 400
        code: INVALID_ARGUMENT
        message: Client specified an invalid argument, request body or query param.
    GENERIC_401_UNAUTHENTICATED:
      description: Request cannot be authenticated and a new authentication is required
      value:
        status: 401
        code: UNAUTHENTICATED
        message: Request not authenticated due to missing, invalid, or expired credentials. A new authentication is required.
    GENERIC_403_PERMISSION_DENIED:
      description: Permission denied. OAuth2 token access does not have the required scope or when the user fails operational security
      value:
        status: 403
        code: PERMISSION_DENIED
        message: Client does not have sufficient permissions to perform this action.
    GENERIC_404_IDENTIFIER_NOT_FOUND:
      description: The identifier cannot be matched to a device or phone number
      value:
        status: 404
        code: IDENTIFIER_NOT_FOUND
        message: The identifier is not found.
    GENERIC_422_SERVICE_NOT_APPLICABLE:
      description: Service not applicable for the provided identifier
      value:
        status: 422
        code: SERVICE_NOT_APPLICABLE
        message: The service is not available for the provided identifier.
    GENERIC_422_MISSING_IDENTIFIER_PHONE_NUMBER:
      description: The phone number is not included in the request and cannot be derived from the access token
      value:
        status: 422
        code: MISSING_IDENTIFIER
        message: The phone number cannot be identified.
    GENERIC_422_UNNECESSARY_IDENTIFIER_PHONE_NUMBER:
      description: An explicit phone number is provided when the phone number has already been identified from the access token
      value:
        status: 422
        code: UNNECESSARY_IDENTIFIER
        message: The phone number is already identified by the access token.
    GENERIC_429_TOO_MANY_REQUESTS:
      description: Access to the API has been temporarily blocked due to rate or spike arrest limits being reached
      value:
        status: 429
        code: TOO_MANY_REQUESTS
        message: Rate limit reached.
  responses:
    BadRequest400:
      description: Bad Request
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              $ref: '#/components/examples/GENERIC_400_INVALID_ARGUMENT'
    Unauthenticated401:
      description: Unauthorized
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 401
                  code:
                    enum:
                      - UNAUTHENTICATED
          examples:
            GENERIC_401_UNAUTHENTICATED:
              $ref: '#/components/examples/GENERIC_401_UNAUTHENTICATED'
    PermissionDenied403:
      description: Forbidden
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 403
                  code:
                    enum:
                      - PERMISSION_DENIED
          examples:
            GENERIC_403_PERMISSION_DENIED:
              $ref: '#/components/examples/GENERIC_403_PERMISSION_DENIED'
    IdentifierNotFound404:
      description: Not found
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - IDENTIFIER_NOT_FOUND
          examples:
            GENERIC_404_IDENTIFIER_NOT_FOUND:
              $ref: '#/components/examples/GENERIC_404_IDENTIFIER_NOT_FOUND'
    PhoneNumberIdentifier422:
      description: Unprocessable Content
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 422
                  code:
                    enum:
                      - SERVICE_NOT_APPLICABLE
                      - MISSING_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
          examples:
            GENERIC_422_SERVICE_NOT_APPLICABLE:
              $ref: '#/components/examples/GENERIC_422_SERVICE_NOT_APPLICABLE'
            GENERIC_422_MISSING_IDENTIFIER_PHONE_NUMBER:
              $ref: '#/components/examples/GENERIC_422_MISSING_IDENTIFIER_PHONE_NUMBER'
            GENERIC_422_UNNECESSARY_IDENTIFIER_PHONE_NUMBER:
              $ref: '#/components/examples/GENERIC_422_UNNECESSARY_IDENTIFIER_PHONE_NUMBER'
    TooManyRequests429:
      description: Too Many Requests
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 429
                  code:
                    enum:
                      - TOO_MANY_REQUESTS
          examples:
            GENERIC_429_TOO_MANY_REQUESTS:
              $ref: '#/components/examples/GENERIC_429_TOO_MANY_REQUESTS'
